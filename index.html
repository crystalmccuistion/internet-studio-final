<!DOCTYPE html>
<html lang="eng">
  <head>
    <meta charset="utf-8">
    <title>Visual Novel</title>
    <script src="./assets/js/main.js" defer></script>
    <link rel="stylesheet" href="./assets/css/styles.css">
  </head>
  <body>
    <!-- UI -->
    <div>
      <img src="./assets/img/UI_DialogueBox.png" alt="" class="dialoguebox">
    </div>
    <!-- SPEAKER NAME -->
    <div class="speaker" id="m">
      <h1>Morgan</h1>
    </div>
    
    <div class="speaker" id="e">
      <h1>Emma</h1>
    </div>
    
    <!-- DIALOGUE -->
    <div class="dialogue">
      <p>
        If you're on Windows, enter fullscreen by pressing F11 for the best
        experience. Click anywhere in the window to continue. 
      </p>
    </div>

    <div class="dialogue">
      <p>Page 2 also has dialogue. </p>
    </div>

        <div class="dialogue">
      <p>Here's more dialogue. </p>
    </div>

        <div class="dialogue">
      <p>You sure love dialogue. </p>
    </div>
    
        <div class="dialogue">
      <p>That's all. Thanks for playing! </p>
    </div>
    
  </body>
</html>
